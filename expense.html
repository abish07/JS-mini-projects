<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        fieldset{
            display: flex;
            flex-direction: column;
            width: 30vh;
            gap: 20px;
            background-color: antiquewhite;
            align-items: center;
            margin-top: 20px;
            box-shadow: 6px 5px 7px rgb(95, 85, 85);
        }
        .input-field{
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }
        hr{
            margin: 50px 0px;
        }
        .display-expenses{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .display-expenses #expense-table{
            width: 70vh;
            height: auto;
            text-align: center;
        }
        #removeExpense{
            background-color: red;
            color: white;
            transition: ease 0.4;
        }
        #removeExpense:hover{
            background-color: rgb(161, 35, 35);
            cursor: pointer;
        }
        #button{
            cursor: pointer;
            background-color: rgb(237, 174, 81);
            color: rgb(0, 0, 0);
            transition: ease 0.4s;
        }
        #button:hover{
            background-color: rgb(151, 102, 27);
            color: white;
        }

        .add-category{
            background-color: rgb(196, 210, 176);
            display: flex;
            flex-direction: column;
            padding: 0px 50px 50px 50px;
            margin-top:30px;
            width: 20vh;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="input-field">
            <div class="add-category">
                <h3>Add Category if not available:</h3>
                <input type="text" id="add-category">
                <button onclick="add_Category()">Add Category</button>
            </div>
            <form id="expenseform" onsubmit="fetchData(event)">
                <fieldset>
                    <legend>Expense Input</legend>
                    <div class="category">
                        <label for="category">Choose Category:</label>
                        <select name="category" id="category" required nonce="">
                            <option value="" selected disabled></option>
                            <option value="Food">Food</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="Utensils">Utensils</option>
                        </select>
                    </div>
                    <div class="description">
                        <label for="description">Description:</label>
                        <textarea name="description" id="description" required></textarea>
                    </div>
                    <div class="amount">
                        <label for="amount">Amount:</label>
                        <input type="number" id="amount" required min="0">
                    </div>
                    <div class="date">
                        <label for="date">Date:</label>
                        <input type="date" id="date" required min="1998-01-01" >
                    </div>
                    <div class="button">
                        <input type="submit" value="Submit" id="button" >
                    </div>
                </fieldset>
            </form>
        </div>
        <hr>
        <div class="display-expenses">
            <h2 style="text-align: center; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif; color: rgb(0, 179, 250);">EXPENSES:</h2>
            <table id="expense-table" border="1px">

            </table>
            <!-- <div id="analysis">
                <canvas id="expenseChart" width="400" height="300"></canvas>
                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            </div> -->
        </div>
    </div>
    <script>
        let expenses = [];
        let newId = 1;

        function fetchData(event){
            event.preventDefault();
            let expesnseCategory = document.getElementById("category").value;
            let expenseDescription = document.getElementById("description").value.trim();
            let expenseAmount = parseFloat(document.getElementById("amount").value);
            let expenseDate = document.getElementById("date").value;
            let expensesData = {id:newId,category:expesnseCategory,description:expenseDescription,amount:expenseAmount,date:expenseDate};
            newId+=1;
            expenses.push(expensesData);
            document.getElementById("category").value="";
            document.getElementById("date").value="";
            document.getElementById("amount").value="";
            document.getElementById("description").value="";
            updateDisplay();
        }

        function saveData(){
            localStorage.setItem("expenses",JSON.stringify(expenses));
            localStorage.setItem("nextId",JSON.stringify(newId));
        }
        function loadData(){
            expenses = JSON.parse(localStorage.getItem("expenses")) || [];
            newId = JSON.parse(localStorage.getItem("nextId")) || 1;
        }

        function add_Category(){
            let input = document.getElementById("add-category");
            let newCategory = input.value.trim();
            let select = document.getElementById("category");
            let option = document.createElement("option");

            const categoryAlreadyExists = Array.from(select.options).some(opt=>opt.value.toLowerCase() === newCategory.toLowerCase());

            if(categoryAlreadyExists){
                alert("Category already exists");
                input.value= "";
                return;
            }

            option.value = newCategory;
            option.textContent = newCategory;
            select.appendChild(option);
            select.value = newCategory;
            input.value="";
        }

        function renderTable(expensesArray,tableId){
            let expensesTable = document.getElementById(tableId);
            if(expensesArray.length==0){
                expensesTable.innerHTML = `<h1>No Expenses to show.</h1>`;
                return;
            }
            let tableHTML = `
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Remove</th>
                    </tr>
                </thead>
                <tbody>
            `;
            let total=0;
            expensesArray.forEach(event => {
                total += event.amount;
                tableHTML += `
                    <tr>
                        <td>${event.id}</td>
                        <td>${event.category}</td>
                        <td>${event.description}</td>
                        <td>${event.date}</td>
                        <td>${event.amount}</td>
                        <td><button id="removeExpense" onclick="removeExpenses(${event.id})">Remove</button></td>
                    </tr>
                `;
            });
            tableHTML+= `
                </tbody>
                <tfoot>
                    <tr>
                        <td  colspan="4">Grand Total</td>
                        <td>${total}</td>
                    </tr>
                </tfoot>
            `;
            expensesTable.innerHTML = tableHTML;
        }

        function removeExpenses(id){
            expenses = expenses.filter(i=>i.id !==id);
            expenses.forEach((expense, index) => {
            expense.id = index + 1;
            });

            newId = expenses.length + 1;
            updateDisplay()
        }

        // let chartInstance = null;

//             const categoryTotals = expensesArray.reduce((acc, e) => {
//                 acc[e.category] = (acc[e.category] || 0) + e.amount;
//                 return acc;
//             }, {});

//             const labels = Object.keys(categoryTotals);
//             const data = Object.values(categoryTotals);

//             // Destroy old chart before drawing a new one, or they'll stack up
//             if (chartInstance) {
//                 chartInstance.destroy();
//             }

//             const ctx = document.getElementById('expenseChart');
//             chartInstance = new Chart(ctx, {
//                 type: 'bar', // try 'pie' or 'doughnut' too
//                 data: {
//                     labels: labels,
//                     datasets: [{
//                         label: 'Spending by Category',
//                         data: data,
//                         backgroundColor: [
//                             '#ff6384', '#36a2eb', '#ffce56',
//                             '#4bc0c0', '#9966ff', '#ff9f40'
//                         ]
//                     }]
//                 },
//                 options: {
//                     responsive: true,
//                     plugins: {
//                         legend: { display: true }
//                     },
//                     scales: {
//                         y: { beginAtZero: true }
//                     }
//                 }
//             });
//         }
// // 

        function updateDisplay(){
            renderTable(expenses,"expense-table");
            // renderChart(expenses);
            saveData();
        }
        loadData();
        updateDisplay();
    </script>
</body>
</html>
