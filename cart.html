<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="main-container">
        <div class="products">
            <h1>Product List</h1>
            <h1>Cart: <span id="cartCount"></span> Items</h1>
        </div>
        <div id="product-lists"></div>
        <div class="carts">
            <h1>Cart Items</h1>
            <div class="table-responsive">
                <table id="cartTable"></table>
            </div>
            <button class="btn-checkout" onclick="checkOut()">Proceed to Checkout</button>
        </div>
        <div class="order-history">
            <h1>Order Item History</h1>
            <div class="order-responsive">
                <table id="orderTable"></table>
            </div>
        </div>
    </div>
    <script>
        const products = [
            { code: "TSH01", name: "Premium T-shirt", price: 29.99 }, 
            { code: "JNS05", name: "Designer Jeans", price: 79.5 }, 
            { code: "SHS12", name: "Running Shoes", price: 119.99 }, 
            { code: "WCH03", name: "Smart Watch", price: 199.0 }, 
        ];
        let cart = [];
        let orders = [];
        function saveData(){
            localStorage.setItem("cart",JSON.stringify(cart));
            localStorage.setItem("orders",JSON.stringify(orders));
        }
        function loadData(){
            cart = JSON.parse(localStorage.getItem("cart")) || [];
            orders = JSON.parse(localStorage.getItem("orders")) || [];
        }

        function displayData(){
            let container = document.getElementById("product-lists");
            container.innerHTML = "";
            products.forEach((item,index) => {
                const con = document.createElement("div");
                con.className = "box";
                con.innerHTML = `
                    <div class="card-body">
                        <div class="card">
                            <h1>${item.name}</h1>
                            <p>${item.price}</p>
                            <button onclick="addtoCart(${index})">Add to Cart: </button>
                        </div>
                    </div>
                `;
                container.appendChild(con);
            });
        }
        
        function addtoCart(index){
            let product = products[index];
            let existingItem = cart.find(i=>i.code === product.code);
            if(existingItem) existingItem.quantity+=1;
            else cart.push({...product , quantity:1});
            updateDisplay();
        }

        function removeFromCart(code){
            cart = cart.filter(i=>i.code !== code);
            updateDisplay();
        }

        function changeQuantity(code,change){
            let item = cart.find(i=>i.code === code);
            if(item){
                item.quantity += change;
                if(item.quantity<=0) removeFromCart(code);
            }
            updateDisplay();
        }

        function renderTable(dataArray , tableId ,showActions = false){
            let table = document.getElementById(tableId);
            if(dataArray.length === 0){
                table.innerHTML = `<p>No item found in ${showActions? "Cart" : "Order History"}</p>`;
            }
            let tableHTML = `
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Item Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total Price</th>
                        ${showActions? "<th>Action</th>" : ""};
                    </tr>
                </thead>
                <tbody>
            `;
            let grandTotal = 0;
            dataArray.forEach(item => {
                let total = item.price * item.quantity;
                grandTotal += total;

                tableHTML += `
                    <tr>
                        <td>${item.code}</td>
                        <td>${item.name}</td>
                        <td>${item.price}</td>
                        <td>${showActions?` 
                            <button onclick="changeQuantity('${item.code}', -1)">-</button>
                            ${item.quantity}
                            "<button onclick="changeQuantity('${item.code}' , 1)">+</button>"`
                            : item.quantity}
                        </td>
                        }
                        <td>${item.price}</td>
                        ${showActions? `<td><button onclick="removeFromCart('${item.code}')">remove</button></td>`:""}
                    </tr>
                `;
                tableHTML += ` 
                    <tr class="fw-bold"> 
                        <td colspan="${showActions ? 5 : 4}" class="text-end">Grand Total:</td> 
                        <td class="text-end">$${grandTotal.toFixed(2)}</td> 
                    </tr> 
                    </tbody> 
                `; 
                table.innerHTML = tableHTML;
            });
        }

        function checkOut(){
            if(cart.length == 0){
                alert("The cart is empty");
            }
            orders.push(...JSON.parse(JSON.stringify(cart)));
            cart.length==0;
            updateDisplay();
        }

        function updateDisplay(){
            renderTable(cart,"cartTable",true);
            renderTable(orders,"orderTable");
            document.getElementById("cartCount").innerText = cart.reduce((a, b) => a + b.quantity, 0); 
            saveData();
        }
        loadData();
        displayData();
        updateDisplay();
    </script>
</body>
</html>
